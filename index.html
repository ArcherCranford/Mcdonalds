<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Population Density vs McDonald's Locations</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.0/css/all.css">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; background: #fff; font-family: 'Titillium Web', sans-serif; }
        #map { width: 100%; height: 80%; }
        .content { padding: 20px; background: #f9f9f9; }
        .legend {
            font-family: 'Titillium Web', sans-serif;
            line-height: 40px;
            font-size: 16px;
            width: 190px;
            color: #333333;
            padding: 6px 8px;
            background: white;
            background: rgba(255,255,255,0.5);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .legend i {
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }
        .legend p {
            font-size: 14px;
            line-height: 20px;
            margin: 0;
        }
        .marker-color-1 {
            color: #FFC72C;
            font-size: 15px;
            text-shadow: 0 0 3px #000;
        }
    </style>
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
</head>
<body>
<header style="text-align: center; padding: 20px; background: #DA291C; color: white;">
    <h1>Population Density vs McDonald's Locations</h1>
    <h2>Guilford and Surrounding Counties</h2>
</header>
<div id="map"></div>

<script>
// 1. Create a map object
var mymap = L.map('map', {
    center: [36.0726, -79.7915], // Centered on Greensboro/Guilford
    zoom: 9.25,
    detectRetina: true
});

// 2. Add the Stadia Alidade Smooth Dark base map
var CartoDB_DarkMatter = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
	subdomains: 'abcd',
	maxZoom: 20
}).addTo(mymap);

// 3. Add McDonald's GeoJSON Data
var mcdonalds_locations = null;
mcdonalds_locations = L.geoJson.ajax("assets/mcdonalds_locations.geojson", {
    onEachFeature: function (feature, layer) {
        layer.bindPopup(`McDonald's in ${feature.properties.City}`);
    },
    pointToLayer: function(feature, latlng) {
        return L.marker(latlng, {icon: L.divIcon({className: 'fas fa-burger marker-color-1'})});
    },
    attribution: 'Data: Google Maps &copy; OpenStreetMap Contributors | Map Author: Archer Cranford'
}).addTo(mymap);

// 4. Set function for color ramp for population density
var colors = chroma.scale('Reds').colors(5);
function setColor(density) {
    var id = 0;
    if (density > 700) { id = 4; }
    else if (density > 500 && density <= 700) { id = 3; }
    else if (density > 300 && density <= 500) { id = 2; }
    else if (density > 100 && density <= 300) { id = 1; }
    else { id = 0; }
    return colors[id];
}

// 5. Style function for counties
function style(feature) {
    return {
        fillColor: setColor(feature.properties.density),  // Using the new "density" property
        fillOpacity: 0.6,
        weight: 1,
        opacity: 1,
        color: '#333',
        dashArray: '3'
    };
}

// 6. Add county polygons with popup functionality
L.geoJson.ajax("assets/counties.geojson", {
    style: style,
    onEachFeature: function (feature, layer) {
        // Bind a popup to each county showing its name and population density
        var name = feature.properties.County;
        var density = feature.properties.density;
        layer.bindPopup(`<strong>${name}</strong><br>Population Density: ${density} people/sq. mile`);
    }
}).addTo(mymap);

// 7. Add a legend
var legend = L.control({position: 'topright'});
legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>Population Density (Per Sq. Mile)</b><br />';
    div.innerHTML += '<i style="background: ' + colors[4] + '; opacity: 0.5"></i><p>700+</p>';
    div.innerHTML += '<i style="background: ' + colors[3] + '; opacity: 0.5"></i><p>501-700</p>';
    div.innerHTML += '<i style="background: ' + colors[2] + '; opacity: 0.5"></i><p>301-500</p>';
    div.innerHTML += '<i style="background: ' + colors[1] + '; opacity: 0.5"></i><p>101-300</p>';
    div.innerHTML += '<i style="background: ' + colors[0] + '; opacity: 0.5"></i><p>0-100</p>';
    div.innerHTML += '<hr><b>McDonald’s Locations</b><br />';
    div.innerHTML += '<i class="fas fa-burger marker-color-1"></i><p>Restaurant</p>';
    return div;
};
legend.addTo(mymap);

// 8. Add a scale bar to the map
L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
</html>
